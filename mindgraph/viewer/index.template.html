<!doctype html>
<!--
  This is a TEMPLATE — build.mjs generates viewer/index.html from it on every
  build, substituting the content-hashed asset filenames and the build id.
  Never hand-edit viewer/index.html directly; edit this file instead.
-->
<html lang="en" class="no-transition">
<head>
<meta charset="utf-8" />
<title>mindgraph</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="mindgraph-build" content="__BUILD_ID__" />
<link rel="stylesheet" href="/dist/reactflow.css" />
<link rel="stylesheet" href="/dist/__APP_CSS__" />
<script>
// item 4: suppress the theme transition on first paint (no fade-in on load).
// Two rAFs so the class drops only after the first real frame is committed.
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.documentElement.classList.remove("no-transition");
}));
// Caching hardening pass: print the build this page was served from, so a
// "looks stale" report can tell in one glance whether it's the browser (this
// line lags the terminal's on-boot print) or the build (both agree, edit not
// yet made/deployed).
console.log("[mindgraph] build __BUILD_ID__");
</script>
</head>
<body>
<div id="root"></div>
<script src="/dist/__APP_JS__"></script>
</body>
</html>
